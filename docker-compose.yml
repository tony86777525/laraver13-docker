services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: laravel13_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - laravel

  web:
    image: nginx:alpine
    container_name: laravel13_web
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - laravel
    depends_on:
      - app

  db:
    image: mysql:8.4
    container_name: laravel13_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: erp
      MYSQL_ROOT_PASSWORD: 12345678
    ports:
      - "33066:3306"
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - laravel

  node:
    image: node:22-alpine
    container_name: laravel13_node
    working_dir: /var/www
    volumes:
      - ./:/var/www
    ports:
      - "5173:5173"
    tty: true
    networks:
      - laravel

networks:
  laravel:
    driver: bridge

volumes:
  dbdata:
